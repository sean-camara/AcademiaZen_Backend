name: Backend CI

on:
  pull_request:
  push:
    branches: [main, modernization/production-v2]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Block critical dependency advisories
        run: npm audit --audit-level=critical
      - name: Build production container
        run: docker build --tag academiazen-backend:${{ github.sha }} .
